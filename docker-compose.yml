services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?Set POSTGRES_DB in .env}"
      POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER in .env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    volumes:
      - sentinel-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 15

  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}"
    depends_on:
      postgres:
        condition: service_healthy

  checkout-service:
    build:
      context: ./simulator
      dockerfile: checkout_service/Dockerfile
    ports:
      - "8001:8001"
    environment:
      FAULT_LATENCY_MS: "${FAULT_LATENCY_MS:-500}"
      FAULT_ERROR_PROBABILITY: "${FAULT_ERROR_PROBABILITY:-0.5}"

  payment-service:
    build:
      context: ./simulator
      dockerfile: payment_service/Dockerfile
    ports:
      - "8002:8002"
    environment:
      FAULT_LATENCY_MS: "${FAULT_LATENCY_MS:-500}"
      FAULT_ERROR_PROBABILITY: "${FAULT_ERROR_PROBABILITY:-0.5}"

  inventory-service:
    build:
      context: ./simulator
      dockerfile: inventory_service/Dockerfile
    ports:
      - "8003:8003"
    environment:
      FAULT_LATENCY_MS: "${FAULT_LATENCY_MS:-500}"
      FAULT_ERROR_PROBABILITY: "${FAULT_ERROR_PROBABILITY:-0.5}"

  traffic-generator:
    build:
      context: ./simulator
      dockerfile: Dockerfile.traffic-generator
    environment:
      CHECKOUT_SERVICE_URL: http://checkout-service:8001
      PAYMENT_SERVICE_URL: http://payment-service:8002
      INVENTORY_SERVICE_URL: http://inventory-service:8003
      SENTINEL_BACKEND_URL: http://backend:8080
      REQUEST_INTERVAL_SECONDS: "${REQUEST_INTERVAL_SECONDS:-1.0}"
      REQUEST_JITTER_SECONDS: "${REQUEST_JITTER_SECONDS:-0.2}"
      REQUEST_TIMEOUT_SECONDS: "${REQUEST_TIMEOUT_SECONDS:-2.0}"
    depends_on:
      - backend
      - checkout-service
      - payment-service
      - inventory-service

volumes:
  sentinel-postgres-data:
