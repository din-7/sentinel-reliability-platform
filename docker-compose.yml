services:
  checkout-service:
    build:
      context: ./simulator
      dockerfile: checkout_service/Dockerfile
    ports:
      - "8001:8001"
    environment:
      FAULT_LATENCY_MS: "${FAULT_LATENCY_MS:-500}"
      FAULT_ERROR_PROBABILITY: "${FAULT_ERROR_PROBABILITY:-0.5}"

  payment-service:
    build:
      context: ./simulator
      dockerfile: payment_service/Dockerfile
    ports:
      - "8002:8002"
    environment:
      FAULT_LATENCY_MS: "${FAULT_LATENCY_MS:-500}"
      FAULT_ERROR_PROBABILITY: "${FAULT_ERROR_PROBABILITY:-0.5}"

  inventory-service:
    build:
      context: ./simulator
      dockerfile: inventory_service/Dockerfile
    ports:
      - "8003:8003"
    environment:
      FAULT_LATENCY_MS: "${FAULT_LATENCY_MS:-500}"
      FAULT_ERROR_PROBABILITY: "${FAULT_ERROR_PROBABILITY:-0.5}"

  traffic-generator:
    build:
      context: ./simulator
      dockerfile: Dockerfile.traffic-generator
    environment:
      CHECKOUT_SERVICE_URL: http://checkout-service:8001
      PAYMENT_SERVICE_URL: http://payment-service:8002
      INVENTORY_SERVICE_URL: http://inventory-service:8003
      REQUEST_INTERVAL_SECONDS: "${REQUEST_INTERVAL_SECONDS:-1.0}"
      REQUEST_JITTER_SECONDS: "${REQUEST_JITTER_SECONDS:-0.2}"
      REQUEST_TIMEOUT_SECONDS: "${REQUEST_TIMEOUT_SECONDS:-2.0}"
    depends_on:
      - checkout-service
      - payment-service
      - inventory-service
